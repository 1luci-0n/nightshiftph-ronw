<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NightShiftPH Planner — Public View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="public">
<script>try{document.body.dataset.theme=localStorage.getItem("nsph_theme_public")||"dark";}catch(e){}</script>

<div id="loading-screen" class="full-overlay">
  <div class="loading-box">
    <div class="loading-spinner" id="loading-spinner"></div>
    <div id="loading-text">Connecting to NightShiftPH cloud sync…</div>
    <div id="loading-error" style="display:none; max-width:320px; text-align:center; color:var(--danger); font-size:11.5px; margin-top:4px;"></div>
    <button class="btn btn-sm btn-ghost" id="btn-loading-retry" style="display:none;">Retry</button>
  </div>
</div>

<div class="app-shell" id="app-shell" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><span id="brand-logo">⌘</span> <span id="brand-guild-name">NightShiftPH</span></span>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle light/dark">🌙</button>
    </div>
  </header>

  <nav class="sidebar">
    <button class="nav-item nav-item-disabled" data-tooltip="In progress"><span class="ico">📣</span> Announcements</button>
    <button class="nav-item nav-item-disabled" data-tooltip="Fixing bugs, working on it..."><span class="ico">🩹</span> Queues</button>
    <button class="nav-item active" data-view="builder"><span class="ico">⚔</span> Roster</button>
    <button class="nav-item nav-item-disabled" data-tooltip="No current Raffle event for the Guild"><span class="ico">🎟</span> Raffle</button>
  </nav>

  <main class="main">

    <!-- ============ TEAM BUILDER (read-only) ============ -->
    <section id="view-builder" class="view active">
      <div class="view-header">
        <div>
          <div class="view-title">Roster</div>
          <div class="view-desc">Current party lineups across every Elite and Sub Team. The ring on each party shows role coverage — red means a gap admins haven't cleared yet.</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card"><div class="stat-num" id="stat-members">0</div><div class="stat-label">Total members</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-available">0</div><div class="stat-label">Available now</div></div>
      </div>

      <div class="team-tabs" id="team-tabs"></div>
      <div class="actions" id="team-toolbar" style="margin-bottom:14px; align-items:center;"></div>

      <div class="party-grid" id="party-grid"></div>
    </section>
    

  </main>
</div>

<div id="toast-stack"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
